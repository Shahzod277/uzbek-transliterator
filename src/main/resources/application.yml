spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${PORT:8080}

admin:
  password: ${ADMIN_PASSWORD:admin123}

bot:
  username: ${BOT_USERNAME:uzbek_translit_bot}
  token: ${BOT_TOKEN}
